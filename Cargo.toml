[package]
name = "beets-rs"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "beet"
path = "src/main.rs"

[features]
# Audio output for the bpd plugin (rodio/cpal; needs ALSA headers on Linux).
# Without it bpd runs with a null player.
default = []
bpd-audio = ["dep:rodio"]

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive"] }
deunicode = "1.6.2"
dirs = "7.0.0"
fancy-regex = "0.20.1"
glob = "0.3.4"
getrandom = "0.4.3"
hex = "0.4.3"
html-escape = "0.2.15"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif", "bmp", "tiff"] }
inventory = "0.3.25"
jpeg-encoder = "0.7"
libc = "0.2.191"
lofty = "0.25.5"
md-5 = "0.10.6"
pathfinding = "4.16.0"
reflink-copy = "0.1.32"
regex = "1.13.1"
rodio = { version = "0.21", optional = true }
roxmltree = "0.21"
rusqlite = { version = "0.41.1", features = ["bundled", "functions", "load_extension"] }
rustfft = "6.4.1"
scraper = "0.29.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_yaml = "0.9.34"
sha1 = "0.10.6"
sha2 = "0.10.9"
strsim = "0.11.1"
symphonia = { version = "0.5", default-features = false, features = ["mp3", "flac", "wav", "ogg", "vorbis", "pcm", "isomp4", "aac", "alac"] }
tiny_http = "0.12"
unicode-normalization = "0.1.26"
unsafe-libyaml = "0.2.11"
ureq = { version = "2", features = ["json"] }
walkdir = "2.5.0"
zip = { version = "2", default-features = false, features = ["deflate"] }
zbus = "5"

[dev-dependencies]
tempfile = "3.27.0"
