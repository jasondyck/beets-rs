name: Release

# Pushing a tag like v0.1.0 builds the binaries (`beet` and the `beet-gui`
# desktop app) and publishes a GitHub release with them. Running the workflow by hand ("Run workflow") only
# builds, so the platforms can be checked without releasing.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04-arm
          - target: aarch64-apple-darwin
            os: macos-15
          - target: x86_64-apple-darwin
            os: macos-15-intel
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # beet-gui (GPUI) links the desktop libraries: Wayland, X11/xkbcommon,
      # fontconfig and freetype.
      - name: Install GUI build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libxcb1-dev libx11-xcb-dev libfontconfig1-dev libfreetype-dev \
            libvulkan-dev

      - name: Build
        run: cargo build --release --locked --workspace --target ${{ matrix.target }}

      - name: Smoke test
        run: |
          export BEETSRSDIR="$RUNNER_TEMP/beets-rs"
          target/${{ matrix.target }}/release/beet version
          # The GUI's command-line mode (no window needed).
          target/${{ matrix.target }}/release/beet-gui --beet version

      - name: Package
        id: package
        shell: bash
        run: |
          name="beets-rs-${GITHUB_REF_NAME}-${{ matrix.target }}"
          [[ $GITHUB_REF_TYPE == tag ]] || name="beets-rs-dev-${{ matrix.target }}"
          mkdir "$name"
          cp "target/${{ matrix.target }}/release/beet" "target/${{ matrix.target }}/release/beet-gui" README.md LICENSE NOTICE.md "$name/"
          cp gui/README.md "$name/GUI.md"
          cp -r docs "$name/"
          tar -czf "$name.tar.gz" "$name"
          if command -v sha256sum >/dev/null; then
            sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
          else
            shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.name }}
          path: |
            ${{ steps.package.outputs.name }}.tar.gz
            ${{ steps.package.outputs.name }}.tar.gz.sha256

  windows:
    name: Build x86_64-pc-windows-msvc
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: x86_64-pc-windows-msvc

      - name: Build
        run: cargo build --release --locked --workspace --target x86_64-pc-windows-msvc

      - name: Smoke test
        shell: bash
        run: |
          export BEETSRSDIR="$RUNNER_TEMP/beets-rs"
          target/x86_64-pc-windows-msvc/release/beet.exe version
          target/x86_64-pc-windows-msvc/release/beet-gui.exe --beet version

      - name: Package
        id: package
        shell: bash
        run: |
          name="beets-rs-${GITHUB_REF_NAME}-x86_64-pc-windows-msvc"
          [[ $GITHUB_REF_TYPE == tag ]] || name="beets-rs-dev-x86_64-pc-windows-msvc"
          mkdir "$name"
          cp "target/x86_64-pc-windows-msvc/release/beet.exe" "target/x86_64-pc-windows-msvc/release/beet-gui.exe" README.md LICENSE NOTICE.md "$name/"
          cp gui/README.md "$name/GUI.md"
          cp -r docs "$name/"
          # `7z` is on the Windows runners; a zip keeps the executable bit
          # question out of it (Windows has none).
          (cd "$name" && 7z a -bd "../$name.zip" . >/dev/null)
          sha256sum "$name.zip" > "$name.zip.sha256"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.name }}
          path: |
            ${{ steps.package.outputs.name }}.zip
            ${{ steps.package.outputs.name }}.zip.sha256

  release:
    name: Publish release
    needs: [build, windows]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=".github/release-notes/${GITHUB_REF_NAME}.md"
          if [[ -f $notes ]]; then set -- --notes-file "$notes"; else set -- --generate-notes; fi
          gh release create "$GITHUB_REF_NAME" dist/* --title "beets-rs ${GITHUB_REF_NAME}" --verify-tag "$@"
