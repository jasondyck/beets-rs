name: Windows

# Build and test on Windows (PORTING 7.1). Runs on pushes to work/win*
# branches, or by hand ("Run workflow", or gh workflow run windows.yml
# --ref <branch>).
on:
  push:
    branches: ["work/win*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --locked --all-targets

      - name: Test
        run: cargo test --locked --no-fail-fast
