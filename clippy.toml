# Words clippy's `doc_markdown` accepts without backticks in doc comments:
# proper names beets' docs use as words, plus the default list ("..").
doc-valid-idents = [
    "..",
    "AcousticBrainz",
    "AcoustID",
    "AcoustIDs",
    "APEv2",
    "BeautifulSoup",
    "ContentDirectory",
    "CPython",
    "GStreamer",
    "ID3v1",
    "ID3v2",
    "ImageMagick",
    "KeyFinder",
    "ListenBrainz",
    "LRCLib",
    "MediaFile",
    "MusicBrainz",
    "MusicBrainzPseudoRelease",
    "OAuth1",
    "OAuth2",
    "PyYAML",
    "ReplayGain",
    "ReST",
    "UPnP",
    "WavPack",
]
